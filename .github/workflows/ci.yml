name: Quality checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  runtime-container:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tpa_qa:tpa_ci_disposable@127.0.0.1:55439/postgres
      TPA_CONTAINER_QA_OUTPUT: runtime-container.json
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tpa_qa
          POSTGRES_PASSWORD: tpa_ci_disposable
          POSTGRES_DB: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U tpa_qa -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node scripts/security/verify-database-roles.mjs
        env:
          TPA_SECURITY_OUTPUT: .local/launch-readiness/container-roles
      - run: node scripts/verify-runtime-container.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-container
          path: |
            runtime-container.json*
            .local/launch-readiness/container-roles/
          if-no-files-found: error
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tpa_ci:tpa_ci_disposable@127.0.0.1:5432/tpa_ci
      TPA_DATABASE_NAME: tpa_ci
      BETTER_AUTH_SECRET: tpa_ci_disposable_auth_secret_only_for_isolated_tests
      BETTER_AUTH_URL: http://127.0.0.1:3000
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tpa_ci
          POSTGRES_PASSWORD: tpa_ci_disposable
          POSTGRES_DB: tpa_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpa_ci -d tpa_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check:structure
      - run: npm test
      - run: node --test tests/runtime-supervisor.test.mjs tests/runtime-database-environment.test.mjs tests/restricted-adapter.test.mjs
      - run: npm run test:db
      - run: npm run test:email
      - run: npm run test:newsletter
      - run: npm run build
      - run: node --import tsx scripts/verify-email-runtime.mjs
      - run: npm run typecheck
      - run: node scripts/verify-http-ci.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verify-diagnostics
          path: |
            .local/paper-v3-correction/backend-results.json
            .local/email-runtime/
            playwright-report/
            test-results/
          if-no-files-found: warn

  onboarding:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://tpa_ci:tpa_ci_disposable@127.0.0.1:5432/tpa_onboarding_test_ci
      TPA_DATABASE_NAME: tpa_onboarding_test_ci
      BETTER_AUTH_SECRET: tpa_ci_disposable_auth_secret_only_for_isolated_tests
      BETTER_AUTH_URL: http://127.0.0.1:3000
      ONBOARDING_ENABLED: "true"
      TPA_MAIL_SINK: "true"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tpa_ci
          POSTGRES_PASSWORD: tpa_ci_disposable
          POSTGRES_DB: tpa_onboarding_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpa_ci -d tpa_onboarding_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/verify-onboarding-ci.mjs
      - run: mkdir -p .local && node --import tsx scripts/test-member-foundation.mts
      - run: node --import tsx scripts/test-approved-accounts.mts
      - run: node --import tsx scripts/test-member-import-jobs.mts --http
        env:
          TPA_JOB_BROWSER: "true"
          TPA_BROWSER_CHANNEL: ""
      - run: node --import tsx scripts/test-invitation-release.mts
      - run: node --import tsx scripts/test-invitation-release.mts --http
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onboarding-browser-report
          path: |
            playwright-report/
            test-results/
            .local/member-foundation-acceptance.json
            .local/member-http-server.log

  launch-operations:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/testing/launch-readiness'
    env:
      DATABASE_URL: postgresql://tpa_qa:tpa_ci_disposable@127.0.0.1:55439/postgres
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tpa_qa
          POSTGRES_PASSWORD: tpa_ci_disposable
          POSTGRES_DB: postgres
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U tpa_qa -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-launch-readiness.mjs --stage build,worker-build,website,event-flow,engagement,event-operations,roles,restricted
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-operations-evidence
          path: |
            .local/launch-readiness/
            .local/event-flow/
            .local/event-engagement/
            .local/event-operational/
            .local/website-control/
            playwright-report/
            test-results/
          if-no-files-found: error
